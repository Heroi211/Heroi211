<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Select your project">
  <rect width="900" height="280" fill="#030308"/>
  <rect x="8" y="8" width="884" height="264" fill="#0a0a14" stroke="#00ffff" stroke-width="3"/>
  <text x="36" y="48" fill="#ffe600" font-family="monospace" font-size="16" letter-spacing="2">SELECT YOUR PROJECT</text>
  <line x1="36" y1="60" x2="864" y2="60" stroke="#ff00ff" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- cartridge 01 -->
  <rect x="36" y="85" width="195" height="160" fill="#05050c" stroke="#ff00ff" stroke-width="3"/>
  <text x="52" y="115" fill="#ffe600" font-family="monospace" font-size="12">MISSION 01</text>
  <text x="52" y="150" fill="#00ffff" font-family="monospace" font-size="14" font-weight="700">CHURN ATTACK</text>
  <text x="52" y="175" fill="#ff00ff" font-family="monospace" font-size="11">ML CLASSIFICATION</text>
  <rect x="52" y="200" width="90" height="28" fill="#ffe600"/>
  <text x="97" y="219" text-anchor="middle" fill="#030308" font-family="monospace" font-size="12" font-weight="700">PLAY</text>

  <!-- 02 -->
  <rect x="247" y="85" width="195" height="160" fill="#05050c" stroke="#ff00ff" stroke-width="3"/>
  <text x="263" y="115" fill="#ffe600" font-family="monospace" font-size="12">MISSION 02</text>
  <text x="263" y="150" fill="#00ffff" font-family="monospace" font-size="14" font-weight="700">MLOPS RUN</text>
  <text x="263" y="175" fill="#ff00ff" font-family="monospace" font-size="11">PIPELINES</text>
  <rect x="263" y="200" width="90" height="28" fill="#ffe600"/>
  <text x="308" y="219" text-anchor="middle" fill="#030308" font-family="monospace" font-size="12" font-weight="700">PLAY</text>

  <!-- 03 -->
  <rect x="458" y="85" width="195" height="160" fill="#05050c" stroke="#ff00ff" stroke-width="3"/>
  <text x="474" y="115" fill="#ffe600" font-family="monospace" font-size="12">MISSION 03</text>
  <text x="474" y="150" fill="#00ffff" font-family="monospace" font-size="14" font-weight="700">AI AGENTS</text>
  <text x="474" y="175" fill="#ff00ff" font-family="monospace" font-size="11">AUTOMATION</text>
  <rect x="474" y="200" width="90" height="28" fill="#ffe600"/>
  <text x="519" y="219" text-anchor="middle" fill="#030308" font-family="monospace" font-size="12" font-weight="700">PLAY</text>

  <!-- 04 -->
  <rect x="669" y="85" width="195" height="160" fill="#05050c" stroke="#ff00ff" stroke-width="3"/>
  <text x="685" y="115" fill="#ffe600" font-family="monospace" font-size="12">MISSION 04</text>
  <text x="685" y="150" fill="#00ffff" font-family="monospace" font-size="14" font-weight="700">CLOUD QUEST</text>
  <text x="685" y="175" fill="#ff00ff" font-family="monospace" font-size="11">AWS / CLOUD</text>
  <rect x="685" y="200" width="90" height="28" fill="#ffe600"/>
  <text x="730" y="219" text-anchor="middle" fill="#030308" font-family="monospace" font-size="12" font-weight="700">PLAY</text>
</svg>
