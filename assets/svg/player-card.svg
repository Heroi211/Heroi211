<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Player 1 stats">
  <rect width="900" height="280" fill="#030308"/>
  <rect x="8" y="8" width="884" height="264" fill="#0a0a14" stroke="#ff00ff" stroke-width="3"/>
  <rect x="14" y="14" width="872" height="252" fill="none" stroke="#ff00ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

  <text x="36" y="48" fill="#ffe600" font-family="monospace" font-size="18" letter-spacing="3">PLAYER 1</text>
  <text x="820" y="48" text-anchor="end" fill="#00ff88" font-family="monospace" font-size="14" letter-spacing="2">
    READY
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
  <line x1="36" y1="60" x2="864" y2="60" stroke="#ff00ff" stroke-width="2" stroke-dasharray="3 4"/>

  <text x="80" y="100" fill="#ff00ff" font-family="monospace" font-size="13">NAME</text>
  <text x="220" y="100" fill="#00ffff" font-family="monospace" font-size="18" font-weight="700">GABRIEL DRUMOND</text>

  <text x="80" y="135" fill="#ff00ff" font-family="monospace" font-size="13">CLASS</text>
  <text x="220" y="135" fill="#ffe600" font-family="monospace" font-size="18" font-weight="700">PYTHON ENGINEER</text>

  <text x="80" y="170" fill="#ff00ff" font-family="monospace" font-size="13">UNLOCK</text>
  <text x="220" y="170" fill="#ff00ff" font-family="monospace" font-size="16">ML ENGINEER</text>
  <rect x="420" y="152" width="120" height="26" fill="#001820" stroke="#00ffff" stroke-width="1"/>
  <text x="480" y="170" text-anchor="middle" fill="#00ffff" font-family="monospace" font-size="12">
    LOADING...
    <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
  </text>

  <text x="80" y="205" fill="#ff00ff" font-family="monospace" font-size="13">LEVEL</text>
  <text x="220" y="205" fill="#00ff88" font-family="monospace" font-size="24" font-weight="700">90</text>

  <text x="80" y="238" fill="#ff00ff" font-family="monospace" font-size="13">XP</text>
  <text x="220" y="238" fill="#00ff88" font-family="monospace" font-size="14">################--</text>
  <rect x="220" y="248" width="400" height="12" fill="#05050c" stroke="#00ffff" stroke-width="2"/>
  <rect x="222" y="250" width="336" height="8" fill="#00ff88"/>
</svg>
